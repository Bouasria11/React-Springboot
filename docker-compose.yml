services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinestack
      POSTGRES_USER: cinestack
      POSTGRES_PASSWORD: cinestack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cinestack
      SPRING_DATASOURCE_USERNAME: cinestack
      SPRING_DATASOURCE_PASSWORD: cinestack
      JWT_SECRET: change-me-change-me-change-me-change-me-change-me-change-me
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
